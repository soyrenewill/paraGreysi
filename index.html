<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Para Greysi Mabel 🌷❤️</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Quicksand", sans-serif;
      color: #fff;
      position: relative;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 183, 204, 0.30), transparent 25%),
        radial-gradient(circle at 85% 25%, rgba(255, 210, 220, 0.22), transparent 25%),
        radial-gradient(circle at 50% 100%, rgba(183, 67, 98, 0.22), transparent 35%),
        linear-gradient(135deg, #17070e 0%, #2d0b18 45%, #16060d 100%);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image: radial-gradient(rgba(255, 255, 255, 0.5) 1px, transparent 1px);
      background-size: 28px 28px;
      z-index: 0;
    }

    .background-glow {
      position: fixed;
      width: min(500px, 80vw);
      height: min(500px, 80vw);
      border-radius: 50%;
      pointer-events: none;
      filter: blur(80px);
      z-index: 0;
    }

    .glow-1 { top: -200px; left: -150px; background: rgba(255, 105, 150, 0.14); }
    .glow-2 { right: -180px; bottom: -200px; background: rgba(255, 130, 170, 0.12); }

    .main-wrapper {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(12px, 2.5vh, 25px) clamp(12px, 3vw, 24px);
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-message {
      text-align: center;
      color: rgba(255, 235, 241, 0.88);
      font-size: clamp(0.7rem, 2vw, 0.88rem);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      margin-top: clamp(2px, 1vh, 10px);
      flex-shrink: 0;
    }

    .header-message::before {
      content: "♡";
      display: block;
      margin-bottom: 2px;
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      color: #e9a0b3;
    }

    .header-message span {
      display: block;
      margin-top: 4px;
      font-family: "Great Vibes", cursive;
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      letter-spacing: 0;
      text-transform: none;
      color: #f4b6c7;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .envelope-stage {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .envelope {
      --duration: 1400ms;
      /* Cálculo dinámico de ancho y alto proporcional a la pantalla */
      --envelope-w: min(88vw, 480px, 60vh);
      --envelope-h: calc(var(--envelope-w) * 0.61);
      --letter-travel: calc(var(--envelope-h) * -0.72);

      --envelope-bg: #b54d6b;
      --envelope-bg-side: #963651;
      --envelope-bg-bottom: #a8405e;
      --letter-text: #7d2741;

      position: relative;
      width: var(--envelope-w);
      height: var(--envelope-h);
      perspective: 1200px;
      cursor: pointer;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.45));
      z-index: 10;
      /* Compensación vertical para centrar el movimiento de subida de la carta */
      margin-top: calc(var(--envelope-h) * 0.28);
    }

    .envelope::after {
      content: "";
      position: absolute;
      top: 105%;
      left: 50%;
      width: 85%;
      height: 28px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      filter: blur(14px);
      z-index: -1;
    }

    .envelope-inner {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      transform-style: preserve-3d;
      transition: transform var(--duration) cubic-bezier(0.25, 1, 0.5, 1);
    }

    .envelope-front, 
    .envelope-back {
      position: relative;
      grid-area: 1 / 1;
      width: 100%;
      height: 100%;
      border-radius: clamp(12px, 3vw, 20px);
      backface-visibility: hidden;
    }

    .envelope-front {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #c15a77, #9e3956);
      color: white;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        inset 0 0 0 1px rgba(255, 255, 255, 0.12),
        0 12px 25px rgba(0, 0, 0, 0.15);
    }

    .envelope-front::before {
      content: "♥";
      position: absolute;
      font-family: "Times New Roman", serif;
      font-size: clamp(110px, 30vw, 220px);
      line-height: 1;
      color: rgba(255, 255, 255, 0.045);
      transform: rotate(-8deg);
      pointer-events: none;
    }

    .envelope-front::after {
      content: "";
      position: absolute;
      inset: clamp(6px, 1.5vw, 10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: clamp(8px, 2vw, 14px);
      pointer-events: none;
    }

    .address {
      position: relative;
      z-index: 2;
      text-align: center;
      line-height: 1.5;
      padding: clamp(10px, 2.5vw, 18px) clamp(16px, 4vw, 30px);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(3px);
      text-shadow: 0 2px 7px rgba(0, 0, 0, 0.25);
    }

    .address p { margin: 2px 0; }
    
    .address p span:first-child {
      opacity: 0.70;
      font-size: clamp(0.65rem, 1.8vw, 0.82rem);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .address p:first-child span:last-child {
      font-family: "Great Vibes", cursive;
      font-size: clamp(1.3rem, 3.8vw, 2rem);
      font-weight: 400;
      color: #fff1f5;
    }

    .address p:last-child span:last-child {
      font-family: "Great Vibes", cursive;
      font-size: clamp(1.3rem, 3.8vw, 2rem);
      color: #ffd8e3;
    }

    .envelope-back {
      transform: rotateY(180deg);
      background: var(--envelope-bg);
    }

    .envelope-back::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      background: conic-gradient(
        transparent 60deg,
        var(--envelope-bg-side) 60deg 120deg,
        var(--envelope-bg-bottom) 120deg 240deg,
        var(--envelope-bg-side) 240deg 300deg,
        transparent 300deg
      );
      border-radius: clamp(12px, 3vw, 20px);
      pointer-events: none;
    }

    .top-fold {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: linear-gradient(145deg, #d77b94, #b84b69);
      clip-path: polygon(0% 0%, 50% 55%, 100% 0%);
      transform-origin: top;
      transition: transform var(--duration) cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .letter {
      position: absolute;
      bottom: 6px;
      left: 50%;
      width: 92%;
      height: 92%;
      transform: translateX(-50%) translateY(0);
      z-index: 3;
      padding: clamp(10px, 2.5vw, 20px) clamp(8px, 2vw, 16px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: clamp(2px, 1vh, 6px);
      background: linear-gradient(145deg, #fffefd, #fff8f4);
      color: var(--letter-text);
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
      transition: transform 1600ms cubic-bezier(0.25, 1, 0.35, 1);
    }

    .letter::before {
      content: "";
      position: absolute;
      inset: clamp(5px, 1.2vw, 10px);
      border: 1px solid rgba(177, 73, 99, 0.20);
      border-radius: 5px;
      pointer-events: none;
    }

    .letter::after {
      content: "♡";
      position: absolute;
      top: clamp(6px, 1.5vw, 12px);
      right: clamp(10px, 2vw, 18px);
      font-family: "Great Vibes", cursive;
      font-size: clamp(16px, 3.5vw, 26px);
      color: rgba(173, 61, 89, 0.35);
      pointer-events: none;
    }

    .letter p {
      margin: 0;
      max-width: 95%;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(0.82rem, 2.2vw, 1.1rem);
      line-height: 1.38;
      font-weight: 600;
      position: relative;
      z-index: 2;
    }

    .highlight {
      display: block;
      margin-top: clamp(2px, 0.8vh, 6px);
      font-family: "Great Vibes", cursive;
      font-size: clamp(1.35rem, 3.8vw, 2.1rem);
      font-weight: 400;
      color: #a52d50;
    }

    .custom-image {
      width: clamp(34px, 7vw, 52px);
      height: clamp(34px, 7vw, 52px);
      object-fit: contain;
      border-radius: 50%;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 3px 5px rgba(125, 39, 65, 0.15));
    }

    .envelope.open .envelope-inner { 
      transform: rotateY(180deg); 
    }

    .envelope.open-flap .top-fold { 
      transform: rotateX(180deg); 
      z-index: 1; 
    }

    .envelope.open-letter .letter { 
      transform: translateX(-50%) translateY(var(--letter-travel)); 
    }

    .letter-button {
      padding: clamp(10px, 2vw, 13px) clamp(20px, 4vw, 32px);
      border: 1px solid rgba(255, 210, 220, 0.30);
      border-radius: 50px;
      background: linear-gradient(135deg, #d95c7c, #a82f52);
      color: white;
      font-family: "Quicksand", sans-serif;
      font-size: clamp(0.78rem, 2vw, 0.98rem);
      font-weight: 700;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity 1s ease, transform 1s ease, box-shadow 0.3s ease;
      box-shadow: 0 8px 20px rgba(120, 31, 57, 0.25);
      position: relative;
      z-index: 20;
      text-align: center;
      max-width: 90%;
      margin-bottom: clamp(6px, 1.5vh, 16px);
      flex-shrink: 0;
    }

    .letter-button.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
      box-shadow: 0 10px 25px rgba(180, 45, 85, 0.35);
    }

    .letter-button:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 28px rgba(220, 70, 110, 0.45);
    }

    .letter-button:active { 
      transform: scale(0.97); 
    }

    .falling {
      position: fixed;
      top: -30px;
      pointer-events: none;
      z-index: 999;
      animation: fall linear forwards;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.12));
    }

    @keyframes fall {
      from { transform: translateY(0) rotate(0deg); opacity: 1; }
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>

<body>

  <div class="background-glow glow-1"></div>
  <div class="background-glow glow-2"></div>

  <div class="main-wrapper">

    <div class="header-message">
      Una pequeña sorpresa para ti
      <span>En esta primavera... 🌷</span>
    </div>

    <div class="envelope-stage">
      <div class="envelope" id="envelope">
        <div class="envelope-inner">

          <!-- FRENTE DEL SOBRE -->
          <div class="envelope-front">
            <div class="address">
              <p>
                <span>Para:</span><br>
                <span>❤️ Greysi Mabel ❤️</span>
              </p>
              <p>
                <span>De:</span><br>
                <span>Willian Rene</span>
              </p>
            </div>
          </div>

          <!-- REVERSO DEL SOBRE -->
          <div class="envelope-back">
            <div class="top-fold"></div>

            <!-- CARTA INTERIOR -->
            <div class="letter">
              <img src="https://img.freepik.com/vector-premium/pulgar-dedos-imprimir-marca-huella-dactilar-amor-corazon_53500-1839.jpg" alt="Corazón" class="custom-image" onerror="this.src='https://placehold.co/60x60/f4b6c7/7d2741?text=♥'">
              <p>
                Para una dama muy especial... 🌷<br>
                Eres como la Primavera:
                <span class="highlight">Cálida y Hermosa. 🌷❤️</span>
              </p>
            </div>
          </div>

        </div>
      </div>
    </div>

    <button id="goToFlowers" class="letter-button">
      Haz Clic: para ver tu ramo de flores Amarillas 🌷
    </button>

  </div>

  <script>
    const envelope = document.getElementById("envelope");
    const button = document.getElementById("goToFlowers");
    let isAnimating = false;

    /* Sincronización exacta con tiempos armónicos lentos */
    envelope.addEventListener("click", () => {
      if (isAnimating) return;

      const isOpen = envelope.classList.contains("open-letter");

      if (!isOpen) {
        // --- SECUENCIA DE APERTURA ---
        isAnimating = true;

        // 1. Giro pausado del sobre (1200ms)
        envelope.classList.add("open");

        setTimeout(() => {
          // 2. Apertura fluida de la solapa (1200ms)
          envelope.classList.add("open-flap");

          setTimeout(() => {
            // 3. La carta sube delicadamente (1600ms)
            envelope.classList.add("open-letter");
            button.classList.add("visible");
            createFallingElements();
            
            setTimeout(() => {
              isAnimating = false;
            }, 1600);

          }, 1200);

        }, 1200);

      } else {
        // --- SECUENCIA DE CIERRE ---
        closeEnvelope();
      }
    });

    function closeEnvelope(callback) {
      isAnimating = true;

      // 1. Ocultar botón y deslizar carta hacia abajo
      button.classList.remove("visible");
      envelope.classList.remove("open-letter");

      setTimeout(() => {
        // 2. Bajar la solapa
        envelope.classList.remove("open-flap");

        setTimeout(() => {
          // 3. Voltear el sobre al frente
          envelope.classList.remove("open");

          setTimeout(() => {
            isAnimating = false;
            if (callback) callback();
          }, 1200);

        }, 1200);

      }, 1400);
    }

    button.addEventListener("click", (event) => {
      event.stopPropagation();
      closeEnvelope(() => {
        window.location.href = "flower.html";
      });
    });

    function createFallingElements() {
      const elements = ["🌸", "🌷", "🌹", "🌺", "💕", "💗", "♡", "❤️"];
      const particleCount = window.innerWidth < 600 ? 18 : 26;

      for (let i = 0; i < particleCount; i++) {
        const element = document.createElement("div");
        element.className = "falling";
        element.textContent = elements[Math.floor(Math.random() * elements.length)];
        element.style.left = Math.random() * 100 + "vw";
        element.style.fontSize = (Math.random() * 10 + 14) + "px";
        element.style.animationDuration = (Math.random() * 3 + 4) + "s";
        element.style.animationDelay = Math.random() * 2 + "s";
        document.body.appendChild(element);

        setTimeout(() => {
          element.remove();
        }, 8000);
      }
    }
  </script>
</body>
</html>
